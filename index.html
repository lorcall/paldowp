<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PALDOWP</title>
<!-- iPhone home-screen app: full screen, dark status bar that lets the app's colour show through -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PALDOWP">
<meta name="theme-color" content="#302C29">
<meta name="color-scheme" content="dark">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #1A1816; overflow: hidden; }
  body { background: radial-gradient(130% 70% at 50% -10%, #3A3532 0%, #252220 55%, #1A1816 100%) #1A1816;
    color: #EFEAE5; font: 16px/1.45 -apple-system, system-ui, sans-serif; -webkit-text-size-adjust: 100%; }
  /* the app sits between the clock and the home bar; the strips around it are painted to match the app */
  #app { position: fixed; left: 0; right: 0; top: env(safe-area-inset-top, 0px); bottom: env(safe-area-inset-bottom, 0px);
    width: 100%; height: calc(100% - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); border: 0; display: block; background: #1A1816; opacity: 0; transition: opacity .25s; }
  #topbar { position: fixed; left: 0; right: 0; top: 0; height: env(safe-area-inset-top, 0px);
    background: linear-gradient(90deg, #2A2725, #2F2B29 25%, #33302D 50%, #2F2B29 75%, #2A2725); }
  #botbar { position: fixed; left: 0; right: 0; bottom: 0; height: env(safe-area-inset-bottom, 0px); background: #1A1816; }
  #app.ready { opacity: 1; }
  .center { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; }
  .coin { width: 76px; height: 76px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #FFD08A, #E07F0A 75%);
    box-shadow: 0 14px 30px rgba(0,0,0,.55); animation: flip 1.4s ease-in-out infinite; display: grid; place-items: center;
    color: #4A2600; font: 800 34px/1 -apple-system, system-ui, sans-serif; }
  @keyframes flip { 50% { transform: scaleX(.12); } }
  .hint { margin-top: 16px; color: #A69D94; font-size: 14px; }
  .setup { max-width: 420px; width: 100%; text-align: left; }
  .setup h1 { font: 800 30px/1.1 -apple-system, system-ui, sans-serif; letter-spacing: .01em; margin: 0 0 8px; }
  .setup p { color: #C9C0B8; margin: 8px 0; }
  .setup ol { color: #C9C0B8; padding-left: 20px; }
  .setup input { width: 100%; box-sizing: border-box; min-height: 50px; margin: 10px 0; padding: 0 14px; border: 0; border-radius: 14px;
    background: #141210; color: #EFEAE5; font-size: 16px; box-shadow: inset 0 2px 5px rgba(0,0,0,.6); }
  .setup button { width: 100%; min-height: 50px; border: 0; border-radius: 16px; font-weight: 700; font-size: 16px; color: #2A1600;
    background: radial-gradient(120% 160% at 35% 20%, #FFC46E, #F08A0C 70%); }
  .setup .err { color: #FF8E8E; min-height: 20px; font-size: 14px; }
  .setup code { color: #FFA43A; word-break: break-all; }
</style>
</head>
<body>
<div id="topbar"></div><div id="botbar"></div>
<div class="center" id="wait"><div><div class="coin">₱</div><div class="hint">Opening PALDOWP…</div></div></div>

<script>
/* Paste your Apps Script web app link (the one ending in /exec) between the quotes,
   or leave it empty and open this page once with ?app=<your link> (the page will help you). */
const APP_URL = '';

const q = new URLSearchParams(location.search);
const url = (APP_URL || q.get('app') || '').trim();
const ok = u => /^https:\/\/script\.google\.com\/(a\/[^/]+\/)?macros\/s\/[\w-]+\/exec/.test(u);

if (!ok(url)) {
  // first-time setup: build a personal link that can be added to the home screen
  document.getElementById('wait').innerHTML =
    '<div class="setup"><h1>PALDOWP launcher</h1>' +
    '<p>Paste your PALDOWP link (from Apps Script → Deploy → Manage deployments; it ends in <code>/exec</code>).</p>' +
    '<input id="u" type="url" inputmode="url" autocomplete="off" placeholder="https://script.google.com/macros/s/…/exec">' +
    '<div class="err" id="e"></div><button id="go">Make my launcher link</button>' +
    '<ol><li>This page reloads with your link built in.</li><li>Tap Share, then <b>Add to Home Screen</b>.</li><li>Open PALDOWP from the new icon.</li></ol></div>';
  document.getElementById('go').onclick = () => {
    const v = document.getElementById('u').value.trim();
    if (!ok(v)) { document.getElementById('e').textContent = 'That doesn’t look like an Apps Script /exec link.'; return; }
    location.href = location.pathname + '?app=' + encodeURIComponent(v);
  };
} else {
  const f = document.createElement('iframe');
  f.id = 'app'; f.title = 'PALDOWP';
  f.allow = 'clipboard-read; clipboard-write';
  f.src = url;
  f.onload = () => { f.classList.add('ready'); setTimeout(() => { const w = document.getElementById('wait'); if (w) w.remove(); }, 300); };
  document.body.appendChild(f);
}
</script>
</body>
</html>
